[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytorch-flwr"
version = "1.0.0"
description = "Federated Learning — FedBN Only (FedAvg)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "flwr[simulation]>=1.29.0",
    "torch",
    "torchvision",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

# ──────────────────────────────────────────────────────────────────────────────
# Experiment hyperparameters
# Edit this section only — no Python code changes needed between experiments.
# ──────────────────────────────────────────────────────────────────────────────
[tool.flwr.app.config]

# ── Federation ────────────────────────────────────────────────────────────────
num-server-rounds = 10         # Total number of FL rounds

# ── Local training (client-side) ──────────────────────────────────────────────
local-epochs    = 2           # Local epochs per client per round
batch-size      = 16          # Mini-batch size (reduced to limit per-actor RAM)
lr-local        = 0.01        # SGD learning rate for local training
momentum        = 0.9         # SGD momentum
