[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytorch-flwr"
version = "1.0.0"
description = "Federated Learning: FedProx + FedGN + Standard-DP"
readme = "README.md"
# Flower 1.26+ requires Python >=3.10
requires-python = ">=3.10"
dependencies = [
    # Message API (flwr.clientapp, flwr.serverapp) available since 1.21.
    # FedProx via flwr.serverapp.strategy available since 1.21+.
    "flwr[simulation]>=1.21.0",
    "torch",
    "torchvision",
    "opacus",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

# ──────────────────────────────────────────────────────────────────────────────
# Experiment hyperparameters — edit here, no Python code changes needed
# ──────────────────────────────────────────────────────────────────────────────
[tool.flwr.app.config]

# ── Federation ────────────────────────────────────────────────────────────────
num-server-rounds = 10        # Total FL rounds

# ── Local training ────────────────────────────────────────────────────────────
local-epochs  = 2             # Local epochs per round per client
batch-size    = 16            # Mini-batch size

# ── FedProx ───────────────────────────────────────────────────────────────────
proximal_mu   = 0.05           # Proximal penalty weight µ (FedProx objective)

# ── Standard-DP (Opacus) ─────────────────────────────────────────────────────
# These are set once at client init (PrivacyEngine is persistent across rounds).
# Changing them mid-experiment would require recreating the engine (resets ε).
noise-multiplier = 1.2        # DP-SGD noise σ  (↑ = more private, slower learning)
max-grad-norm    = 1.0        # Gradient clipping norm C
dp-delta         = 1e-5       # DP δ for ε reporting (keep ≤ 1/n_train)

# ── Data partitioning ─────────────────────────────────────────────────────────
alpha           = 0.3         # Dirichlet concentration (0 = IID, 0.1 = very non-IID, 1.0 ≈ IID)
partition-seed  = 42          # Random seed for Dirichlet partition (reproducibility)
