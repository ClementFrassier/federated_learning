[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytorch-flwr"
version = "1.0.0"
description = "Federated Learning — Ditto + Quantisation + Local-DP + Sparse"
readme = "README.md"
# Flower 1.26+ requires Python >=3.10
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # 1.13+ required for FedYogi + simulation engine.
    # 1.21+ introduces import deprecations (flwr.client → flwr.clientapp, etc.)
    # and the Message API. NumPyClient + ServerAppComponents remain stable through 1.29.
    "flwr[simulation]>=1.21.0",
    "torch",
    "torchvision",
    "opacus",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

# ──────────────────────────────────────────────────────────────────────────────
# Experiment hyperparameters — edit here, no Python code changes needed
# ──────────────────────────────────────────────────────────────────────────────
[tool.flwr.app.config]

# ── Federation ────────────────────────────────────────────────────────────────
num-server-rounds = 10         # Total number of FL rounds

# ── Local training (client-side) ──────────────────────────────────────────────
local-epochs   = 2            # Local epochs per round per client
batch-size     = 16           # Mini-batch size (reduced to limit per-actor RAM)
lr-global      = 0.01        # SGD lr — global (DP) model (set at __init__)
lr-local       = 0.001        # SGD lr — local (personalised) model (per round)
momentum       = 0.9          # SGD momentum

# ── Ditto personalisation ─────────────────────────────────────────────────────
proximal-mu    = 0.1         # Proximal penalty weight µ (Ditto local objective)

# ── Local Differential Privacy (Opacus) ──────────────────────────────────────
# noise-multiplier and max-grad-norm are set ONCE at client initialisation.
# Changing them mid-experiment would require recreating the PrivacyEngine
# (which resets ε). Keep them stable across a full experiment run.
noise-multiplier = 1.2       # DP-SGD noise σ  (↑ = more private, slower learning)
max-grad-norm    = 1.0        # Gradient clipping norm C
dp-delta         = 1e-5       # DP δ for ε reporting (keep ≤ 1/n_train)

# ── Sparse uplink (magnitude pruning) ─────────────────────────────────────────
sparsity-ratio = 0.7          # Fraction of weights zeroed before sending to server

# ──────────────────────────────────────────────────────────────────────────────
# Simulation federation — NOT configured here (Flower 1.26+)
#
# The [tool.flwr.federations] section has been removed. Flower now manages
# federation / SuperLink connection settings in ~/.flwr/config.toml.
# Keeping it here causes a migration error on `flwr run`.
#
# To control num-supernodes and client resources, use the CLI:
#
#   flwr run . --stream
#     (uses Flower's default local simulation)
#
#   Override at runtime:
#     flwr run . --stream \
#       --federation-config "num-supernodes=10 client-resources-num-cpus=4"
#
#   Save permanently (run once):
#     flwr federation simulation-config \
#       "num-supernodes=10 client-resources-num-cpus=4"
#
# OOM tip: Ditto holds 3 models/actor (~0.5 GB each).
# client-resources-num-cpus=4 limits concurrent actors to 2 on an 8-core
# machine → peak RAM ~1–2 GB instead of 4+ GB.
# ──────────────────────────────────────────────────────────────────────────────
